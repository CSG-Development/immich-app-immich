<!doctype html>
<html>
  <head>
    <!-- (used for SSR) -->
    <!-- metadata:tags -->

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="/photos/static/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/photos/static/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/photos/static/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/photos/static/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/photos/static/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/photos/static/favicon-144.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/photos/static/apple-icon-180.png" />
    <link rel="preload" as="font" type="font/ttf" href="%app.font%" crossorigin="anonymous" />
    <link rel="preload" as="font" type="font/ttf" href="%app.monofont%" crossorigin="anonymous" />
    <script>
      /**
       * Prevent FOUC on page load.
       * Must stay in sync with @immich/ui themeManager (immich-ui-theme).
       */
      (function () {
        const colorThemeKeyName = 'immich-ui-theme';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        let preference = 'system';
        try {
          const raw = localStorage.getItem(colorThemeKeyName);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (typeof parsed === 'object' && parsed) {
              if (parsed.system) {
                preference = 'system';
              } else if (parsed.value === 'light' || parsed.value === 'dark' || parsed.value === 'system') {
                preference = parsed.value;
              }
            } else if (parsed === 'light' || parsed === 'dark' || parsed === 'system') {
              preference = parsed;
            }
          }
        } catch (_) {
          preference = 'system';
        }

        const isDark =
          preference === 'dark' || (preference === 'system' && prefersDark);

        const root = document.documentElement;
        if (isDark) {
          root.classList.remove('light');
          root.classList.add('dark');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
        }
      })();
    </script>
    %sveltekit.head%
    <style>
      /* prevent FOUC */
      html {
        height: 100%;
        width: 100%;
        background-color: #eaeff4;
      }

      html.dark {
        background-color: #474f5d;
      }

      body,
      html {
        margin: 0;
        padding: 0;
      }

      #stencil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: #eaeff4;
        box-sizing: border-box;
        /* Match Tailwind preflight before app.css loads to avoid a layout jump */
        line-height: 1.5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
      }

      /* Prevent scrollbar from app content under the splash shifting the layout */
      html:has(#stencil) {
        overflow: hidden;
      }

      .dark #stencil {
        background-color: #474f5d;
      }

      #stencil .stencil-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: min(100%, 36rem);
        min-height: min(44rem, calc(100dvh - 3rem));
        padding: 4.5rem 3.5rem;
        background-color: #ffffff;
        border-radius: 2.5rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        box-sizing: border-box;
      }

      @media (max-width: 40rem) {
        #stencil {
          padding: 0;
        }

        #stencil .stencil-card {
          width: 100%;
          min-height: 100%;
          padding: 3rem 2rem;
          border-radius: 0;
          box-shadow: none;
        }

        #stencil .stencil-brand {
          width: 9rem;
        }

        #stencil .stencil-icon {
          margin-top: 2.5rem;
          width: 12rem;
          height: 12rem;
        }

        #stencil .stencil-label {
          margin-top: 2.5rem;
          font-size: 1.5rem;
        }
      }

      .dark #stencil .stencil-card {
        background-color: #171717;
      }

      #stencil .stencil-brand {
        position: relative;
        width: 10.5rem;
        aspect-ratio: 162 / 48;
        flex-shrink: 0;
      }

      #stencil .stencil-brand-logo {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        object-fit: contain;
      }

      #stencil .stencil-brand-logo--dark {
        visibility: hidden;
      }

      .dark #stencil .stencil-brand-logo--light {
        visibility: hidden;
      }

      .dark #stencil .stencil-brand-logo--dark {
        visibility: visible;
      }

      #stencil .stencil-icon {
        margin-top: 3.5rem;
        display: block;
        width: 16rem;
        height: 16rem;
        max-width: none;
        flex-shrink: 0;
        object-fit: contain;
      }

      #stencil .stencil-label {
        margin: 3.5rem 0 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.75rem;
        font-weight: 400;
        line-height: 1.5;
        color: #000000;
        text-align: center;
      }

      .dark #stencil .stencil-label {
        color: #ffffff;
      }

      .bg-immich-bg {
        background-color: white;
      }

      .dark .dark\:bg-immich-dark-bg {
        background-color: black;
      }
    </style>

    <noscript
      class="absolute z-1000 flex h-screen w-screen place-content-center place-items-center bg-immich-bg dark:bg-immich-dark-bg dark:text-immich-dark-fg"
    >
      To use Personal Cloud Photos, you must enable JavaScript or use a JavaScript compatible browser.
    </noscript>
  </head>

  <body class="bg-bg text-dark">
    <div id="stencil">
      <div class="stencil-card">
        <div class="stencil-brand">
          <img
            class="stencil-brand-logo stencil-brand-logo--light"
            src="/photos/static/seagate-personal-cloud-logo-light.svg"
            alt="Seagate Personal Cloud"
            width="162"
            height="48"
          />
          <img
            class="stencil-brand-logo stencil-brand-logo--dark"
            src="/photos/static/seagate-personal-cloud-logo-dark.svg"
            alt=""
            width="162"
            height="48"
          />
        </div>
        <img
          class="stencil-icon"
          src="/photos/static/immich-logo.svg"
          alt=""
          width="256"
          height="256"
        />
        <p class="stencil-label">Photos</p>
      </div>
    </div>
    <div>%sveltekit.body%</div>
  </body>
</html>
