components:
    schemas:
        About:
            properties:
                certificate_common_name:
                    type: string
                date:
                    format: date-time
                    type: string
                default_mac_addr:
                    type: string
                hardware_info:
                    $ref: '#/components/schemas/AboutHardware'
                hostname:
                    type: string
                install_id:
                    type: string
                model_name:
                    type: string
                model_number:
                    type: string
                network_interfaces:
                    items:
                        $ref: '#/components/schemas/AboutNetwork'
                    type: array
                os_state:
                    enum:
                        - normal
                        - recovery
                        - update
                        - provisioning
                        - unknown
                        - reset
                    type: string
                product_id:
                    example: padlock
                    type: string
                serial_number:
                    type: string
                version:
                    type: string
            required:
                - version
                - serial_number
                - default_mac_addr
                - product_id
                - hardware_info
                - install_id
                - hostname
                - os_state
                - model_name
                - model_number
                - network_interfaces
                - date
                - certificate_common_name
            type: object
        AboutHardware:
            properties:
                memory:
                    type: number
                processor_count:
                    type: integer
                processor_type:
                    type: string
            required:
                - memory
                - processor_type
                - processor_count
            type: object
        AboutIPv4Info:
            properties:
                gateway:
                    type: string
                ipv4:
                    type: string
                netmask:
                    type: string
            required:
                - ipv4
                - netmask
                - gateway
            type: object
        AboutNetwork:
            properties:
                ipv4_info:
                    $ref: '#/components/schemas/AboutIPv4Info'
                link:
                    type: string
                mac_address:
                    type: string
                name:
                    type: string
                type:
                    enum:
                        - wired
                        - wireless
                    type: string
            required:
                - name
                - type
                - mac_address
            type: object
        AppStatus:
            properties:
                files:
                    description: The status of the Files app
                    type: string
                photos:
                    description: The status of the Photos app
                    type: string
            required:
                - photos
                - files
            type: object
        AuthResponse:
            description: |
                Authentication response structure.
            properties:
                access_token:
                    description: JWT access token to use in the Authorization header for API requests.
                    type: string
                expires_in:
                    description: Number of seconds until the access token expires. After this period, the token will no longer be accepted.
                    type: integer
                refresh_token:
                    description: Token used to obtain a new access token when the current one expires.
                    type: string
                type:
                    description: The type of the access token. Always 'Bearer' for this API.
                    enum:
                        - Bearer
                    type: string
            required:
                - access_token
                - type
                - expires_in
                - refresh_token
            type: object
        Error:
            type: object
            required:
                - name
                - stacktrace
            properties:
                name:
                    type: string
                    description: The error name
                stacktrace:
                    type: string
                    description: The stacktrace
                reason:
                    type: string
                    description: the error name can be raised for multiple reasons
        OOBE:
            properties:
                done:
                    type: boolean
            required:
                - done
            type: object
        Status:
            properties:
                OOBE:
                    $ref: '#/components/schemas/OOBE'
                apps:
                    $ref: '#/components/schemas/AppStatus'
                state:
                    description: The overall state of the device
                    enum:
                        - starting
                        - ready
                        - unknown
                        - error
                    type: string
            required:
                - state
                - apps
                - OOBE
            type: object
    securitySchemes:
        BearerAuth:
            scheme: bearer
            type: http
info:
    contact:
        email: softnas@seagate.com
    description: |
        Homecloud Backend API exposes endpoints for user management, authentication, device status, and onboarding flows.

        ## Main Features
        - **Authentication**: Secure login and token refresh endpoints.
        - **User Management**: Create, update, delete, and list users and invites.
        - **Owner & OOBE**: Special endpoints for device owner creation and Out-Of-Box Experience (OOBE) tracking.
        - **Status Monitoring**: Retrieve overall device and application status.

        ## Security
        - Most endpoints require Bearer authentication with appropriate scopes (`admin`, `user`).
        - Owner and onboarding endpoints are public during initial setup.

        ## Data Validation
        - Email, username, and password fields are strictly validated (see schema patterns).
        - Error responses are standardized.

        ## Usage
        - All endpoints are available under `/api/v1` and `/configuration/api/v1`.
        - See individual path and schema documentation for details on request/response formats.

        For support or questions, contact softnas@seagate.com.
    title: Homecloud Backend API
    version: 1.1.0
openapi: 3.0.3
paths:
    /about:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/About'
                    description: The system info
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security: []
            summary: Return information about the system
            tags:
                - System
    /auth/login:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    format: email
                                    type: string
                                password:
                                    maxLength: 72
                                    minLength: 8
                                    type: string
                            required:
                                - email
                                - password
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse'
                    description: User login was successful
                "400":
                    description: Bad input parameter
                "401":
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security: []
            summary: Login the user with email and password
            tags:
                - auth
    /auth/logout:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                refresh_token:
                                    type: string
                            required:
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    description: Successfully logged out session
                "404":
                    description: Token not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security:
                - BearerAuth:
                    - user
            summary: Logout from a session, given the latest refresh token
            tags:
                - auth
    /auth/refresh:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                grant_type:
                                    enum:
                                        - refresh_token
                                    type: string
                                refresh_token:
                                    type: string
                            required:
                                - grant_type
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse'
                    description: Access token was successfully refreshed
                "400":
                    description: Bad input parameter
                "401":
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security: []
            summary: Retrieve a new access token using the refresh token
            tags:
                - auth
    /status:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
                    description: The device's status
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security: []
            summary: Get the device's status
            tags:
                - status
    /status/oobe:
        get:
            operationId: getStatusOOBE
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OOBE'
                    description: The OOBE status
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security: []
            summary: Get the OOBE status
            tags:
                - status
security:
    - BearerAuth:
        - admin
servers:
    - url: /api/v1
tags:
    - name: Not implemented
