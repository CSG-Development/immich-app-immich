components:
    schemas:
        About:
            properties:
                certificate_common_name:
                    type: string
                date:
                    format: date-time
                    type: string
                default_mac_addr:
                    type: string
                hardware_info:
                    $ref: '#/components/schemas/AboutHardware'
                hostname:
                    type: string
                install_id:
                    type: string
                model_name:
                    type: string
                model_number:
                    type: string
                network_interfaces:
                    items:
                        $ref: '#/components/schemas/AboutNetwork'
                    type: array
                os_state:
                    enum:
                        - normal
                        - recovery
                        - update
                        - provisioning
                        - unknown
                        - reset
                    type: string
                product_id:
                    example: padlock
                    type: string
                serial_number:
                    type: string
                version:
                    type: string
            required:
                - version
                - serial_number
                - default_mac_addr
                - product_id
                - hardware_info
                - install_id
                - hostname
                - os_state
                - model_name
                - model_number
                - network_interfaces
                - date
                - certificate_common_name
            type: object
        AboutHardware:
            properties:
                memory:
                    type: number
                processor_count:
                    type: integer
                processor_type:
                    type: string
            required:
                - memory
                - processor_type
                - processor_count
            type: object
        AboutIPv4Info:
            properties:
                gateway:
                    type: string
                ipv4:
                    type: string
                netmask:
                    type: string
            required:
                - ipv4
                - netmask
                - gateway
            type: object
        AboutNetwork:
            properties:
                ipv4_info:
                    $ref: '#/components/schemas/AboutIPv4Info'
                link:
                    type: string
                mac_address:
                    type: string
                name:
                    type: string
                type:
                    enum:
                        - wired
                        - wireless
                    type: string
            required:
                - name
                - type
                - mac_address
            type: object
        AdvancedConfig:
            properties:
                ssh_enabled:
                    type: boolean
                swagger_ui_enabled:
                    type: boolean
                update_labels:
                    items:
                        $ref: '#/components/schemas/UpdateLabel'
                    type: array
            required:
                - ssh_enabled
                - swagger_ui_enabled
                - update_labels
            type: object
        AppStatus:
            properties:
                files:
                    description: The status of the Files app
                    type: string
                photos:
                    description: The status of the Photos app
                    type: string
            required:
                - photos
                - files
            type: object
        AuthResponse:
            description: |
                Authentication response structure.
            properties:
                access_token:
                    description: JWT access token to use in the Authorization header for API requests.
                    type: string
                expires_in:
                    description: Number of seconds until the access token expires. After this period, the token will no longer be accepted.
                    type: integer
                refresh_token:
                    description: Token used to obtain a new access token when the current one expires.
                    type: string
                type:
                    description: The type of the access token. Always 'Bearer' for this API.
                    enum:
                        - Bearer
                    type: string
            required:
                - access_token
                - type
                - expires_in
                - refresh_token
            type: object
        DeviceConfiguration:
            properties:
                device_certificate_signed_by:
                    $ref: '#/components/schemas/DeviceConfigurationCertificate'
                prod_failure_reasons:
                    description: when the prod_ready field is set to false there will be the reasons written here
                    items:
                        type: string
                    type: array
                prod_ready:
                    type: boolean
                provisioning_vault:
                    $ref: '#/components/schemas/DeviceConfigurationProvisioningVault'
                secure_boot_enabled:
                    type: boolean
            required:
                - provisioning_vault
                - prod_ready
                - secure_boot_enabled
                - prod_failure_reasons
            type: object
        DeviceConfigurationCertificate:
            properties:
                name:
                    type: string
                value:
                    description: certificate in pem format
                    type: string
            required:
                - name
                - value
            type: object
        DeviceConfigurationProvisioningVault:
            properties:
                SSID:
                    type: string
                certificates:
                    items:
                        $ref: '#/components/schemas/DeviceConfigurationCertificate'
                    type: array
                creation_date:
                    format: date-time
                    type: string
                signed_by:
                    $ref: '#/components/schemas/DeviceConfigurationCertificate'
            required:
                - creation_date
                - certificates
                - signed_by
            type: object
        DuplexType:
            enum:
                - full
                - half
            type: string
        Error:
            properties:
                error:
                    description: The generic error
                    type: string
                message:
                    description: The specific error message
                    type: string
            required:
                - error
                - message
            type: object
        HardwareInfo:
            properties:
                auto_negotiation:
                    type: boolean
                is_active:
                    type: boolean
                is_loopback:
                    type: boolean
                mac_address:
                    type: string
                max_speed:
                    type: integer
                max_speed_duplex:
                    $ref: '#/components/schemas/DuplexType'
                maximum_mtu:
                    type: integer
                minimum_mtu:
                    type: integer
                model:
                    type: string
                mtu:
                    type: integer
                vendor:
                    type: string
            required:
                - mac_address
                - mtu
                - minimum_mtu
                - maximum_mtu
                - is_active
                - is_loopback
                - max_speed
                - max_speed_duplex
                - auto_negotiation
                - vendor
                - model
            type: object
        Hello:
            properties:
                world:
                    type: string
            required:
                - world
            type: object
        IPv4Config:
            properties:
                gateway:
                    type: string
                ipv4:
                    type: string
                name_servers:
                    items:
                        type: string
                    type: array
                netmask:
                    type: string
            required:
                - ipv4
                - netmask
            type: object
        IPv4Info:
            properties:
                broadcast:
                    type: string
                dhcp:
                    type: boolean
                gateway:
                    type: string
                ipv4:
                    type: string
                name_servers:
                    items:
                        type: string
                    type: array
                netmask:
                    type: string
            required:
                - ipv4
                - netmask
                - broadcast
                - dhcp
                - gateway
                - name_servers
            type: object
        InterfaceConfig:
            properties:
                dhcp:
                    type: boolean
                ipv4_config:
                    $ref: '#/components/schemas/IPv4Config'
                mtu:
                    type: integer
            required:
                - dhcp
            type: object
        Invite:
            properties:
                creation_date:
                    format: date-time
                    type: string
                email:
                    format: email
                    type: string
            required:
                - email
                - creation_date
            type: object
        LinkInfo:
            properties:
                duplex:
                    $ref: '#/components/schemas/DuplexType'
                link:
                    $ref: '#/components/schemas/LinkStatus'
                speed:
                    type: integer
            required:
                - link
                - duplex
                - speed
            type: object
        LinkStatus:
            enum:
                - up
                - down
            type: string
        NTPConfig:
            properties:
                enabled:
                    type: boolean
                servers:
                    items:
                        type: string
                    type: array
                synchronized:
                    type: boolean
            required:
                - enabled
                - synchronized
                - servers
            type: object
        NetworkInterface:
            properties:
                hardware_info:
                    $ref: '#/components/schemas/HardwareInfo'
                ipv4_info:
                    $ref: '#/components/schemas/IPv4Info'
                link_info:
                    $ref: '#/components/schemas/LinkInfo'
                name:
                    type: string
                type:
                    enum:
                        - wired
                        - wireless
                    type: string
            required:
                - name
                - type
                - hardware_info
            type: object
        OOBE:
            properties:
                done:
                    type: boolean
            required:
                - done
            type: object
        PowerOffType:
            description: |
                type:
                  * `shutdown` - Will shutdown device.
                  * `reboot` - Will reboot device.
            enum:
                - shutdown
                - reboot
            type: string
        ResetType:
            description: |
                type:
                  * `reset_settings` - It reverts the device settings to their OOBE state: IP configuration, Device Name, Services enabled, etc.
                  * `reset_device` - It erases also the "Device" and "User Data" partitions.
                  * `reset_provisioning` - It erases also the "Provisioning" partition.
            enum:
                - reset_settings
                - reset_device
                - reset_provisioning
            type: string
        SMTPConfig:
            properties:
                password:
                    type: string
                port:
                    type: integer
                server:
                    type: string
                user:
                    type: string
            required:
                - server
                - port
                - user
                - password
            type: object
        Status:
            properties:
                OOBE:
                    $ref: '#/components/schemas/OOBE'
                apps:
                    $ref: '#/components/schemas/AppStatus'
                state:
                    description: The overall state of the device
                    enum:
                        - starting
                        - ready
                        - unknown
                        - error
                    type: string
            required:
                - state
                - apps
                - OOBE
            type: object
        TimeConfig:
            properties:
                date:
                    format: date-time
                    type: string
                ntp:
                    $ref: '#/components/schemas/NTPConfig'
                timezone:
                    type: string
            required:
                - ntp
                - timezone
                - date
            type: object
        Update:
            properties:
                type:
                    $ref: '#/components/schemas/UpdateType'
                version:
                    type: string
            required:
                - version
                - type
            type: object
        UpdateInfo:
            properties:
                current_version:
                    type: string
                target_version:
                    type: string
            required:
                - current_version
                - target_version
            type: object
        UpdateLabel:
            properties:
                enabled:
                    type: boolean
                name:
                    type: string
            required:
                - name
                - enabled
            type: object
        UpdateProgress:
            properties:
                progress:
                    type: integer
            required:
                - progress
            type: object
        UpdateType:
            enum:
                - online
                - offline
                - all
                - unknown
            type: string
        User:
            properties:
                email:
                    format: email
                    type: string
                error:
                    type: string
                is_admin:
                    type: boolean
                is_owner:
                    type: boolean
                name:
                    type: string
                user_id:
                    type: string
                    x-go-name: UserID
            required:
                - user_id
                - email
                - name
                - is_admin
                - is_owner
                - error
            type: object
        WifiConfig:
            properties:
                SSID:
                    type: string
                password:
                    description: Password for the Wi-Fi network. Can only be set.
                    type: string
            required:
                - SSID
                - password
            type: object
    securitySchemes:
        BearerAuth:
            scheme: bearer
            type: http
info:
    contact:
        email: softnas@seagate.com
    description: |
        Homecloud Backend API exposes endpoints for user management, authentication, device status, and onboarding flows.

        ## Main Features
        - **Authentication**: Secure login and token refresh endpoints.
        - **User Management**: Create, update, delete, and list users and invites.
        - **Owner & OOBE**: Special endpoints for device owner creation and Out-Of-Box Experience (OOBE) tracking.
        - **Status Monitoring**: Retrieve overall device and application status.

        ## Security
        - Most endpoints require Bearer authentication with appropriate scopes (`admin`, `user`).
        - Owner and onboarding endpoints are public during initial setup.

        ## Data Validation
        - Email, username, and password fields are strictly validated (see schema patterns).
        - Error responses are standardized.

        ## Usage
        - All endpoints are available under `/api/v1` and `/configuration/api/v1`.
        - See individual path and schema documentation for details on request/response formats.

        For support or questions, contact softnas@seagate.com.
    title: Homecloud Backend API
    version: 1.1.0
openapi: 3.0.3
paths:
    /about:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/About'
                    description: The system info
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security: []
            summary: Return information about the system
            tags:
                - System
    /about/certificate:
        get:
            responses:
                "200":
                    content:
                        application/x-x509-ca-cert:
                            schema:
                                format: binary
                                type: string
                    description: Return the device certfificate file
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security: []
            summary: Return the device certfificate
            tags:
                - System
    /about/configuration:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeviceConfiguration'
                    description: The current configuration
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security: []
            summary: Return configuration information about the system
            tags:
                - System
    /advanced/{passkey}/config:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdvancedConfig'
                    description: Return the current configuration
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security: []
            summary: return the current configuration and reboot
            tags:
                - Advanced
        parameters:
            - description: The passkey that needs to be used
              in: path
              name: passkey
              required: true
              schema:
                type: string
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdvancedConfig'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdvancedConfig'
                    description: Return the current configuration
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdvancedConfig'
                    description: Return the current configuration, no reboot
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security: []
            summary: Update the current configuration
            tags:
                - Advanced
    /auth/login:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    format: email
                                    type: string
                                password:
                                    maxLength: 72
                                    minLength: 8
                                    type: string
                            required:
                                - email
                                - password
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse'
                    description: User login was successful
                "400":
                    description: Bad input parameter
                "401":
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security: []
            summary: Login the user with email and password
            tags:
                - auth
    /auth/logout:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                refresh_token:
                                    type: string
                            required:
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    description: Successfully logged out session
                "404":
                    description: Token not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security:
                - BearerAuth:
                    - user
            summary: Logout from a session, given the latest refresh token
            tags:
                - auth
    /auth/refresh:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                grant_type:
                                    enum:
                                        - refresh_token
                                    type: string
                                refresh_token:
                                    type: string
                            required:
                                - grant_type
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse'
                    description: Access token was successfully refreshed
                "400":
                    description: Bad input parameter
                "401":
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security: []
            summary: Retrieve a new access token using the refresh token
            tags:
                - auth
    /diag:
        get:
            responses:
                "200":
                    content:
                        application/zip:
                            schema:
                                format: binary
                                type: string
                    description: The diagnostic protected by the PassKey
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security: []
            summary: Return the diagnostic
            tags:
                - Support
    /hello:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Hello'
                    description: Hello API
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            summary: Hello World
            tags:
                - System
    /network/interfaces:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/NetworkInterface'
                                type: array
                    description: The list of network interfaces
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            summary: Allows listing network interfaces
            tags:
                - Network
    /network/interfaces/{interface}:
        parameters:
            - in: path
              name: interface
              required: true
              schema:
                type: string
        put:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InterfaceConfig'
                description: The requested interface configuration
                required: true
            responses:
                "202":
                    description: The interface will be configured
                "400":
                    description: Invalid configuration
                "403":
                    description: The interface cannot be configured (only interfaces of role 'data' can be configure)
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            summary: Allows configuring a network interface
            tags:
                - Network
    /power:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                action:
                                    $ref: '#/components/schemas/PowerOffType'
                            required:
                                - action
                            type: object
                required: true
            responses:
                "202":
                    description: The device turns off or reboot
                "400":
                    description: Bad Input Parameter
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security:
                - BearerAuth:
                    - admin
                    - provisioning
            summary: To power off or reboot the device
            tags:
                - Support
    /reset:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                provisioning_password:
                                    description: Only required when calling with type=reset_provisioning
                                    type: string
                                type:
                                    $ref: '#/components/schemas/ResetType'
                            required:
                                - type
                            type: object
                required: true
            responses:
                "202":
                    description: The device restarts into recovery to perform the reset
                "400":
                    description: Bad Input Parameter
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security:
                - BearerAuth:
                    - admin
                    - provisioning
            summary: To reset the device
            tags:
                - Support
    /smtp:
        get:
            operationId: GetSMTP
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SMTPConfig'
                    description: The current SMTP relay configuration
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            summary: Get the SMTP relay current configuration
            tags:
                - System
        post:
            operationId: PostSMTP
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SMTPConfig'
                description: The SMTP relay configuration to set
                required: true
            responses:
                "204":
                    description: The SMTP relay configuration was successfully set
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            summary: Set the current SMTP relay configuration
            tags:
                - System
    /status:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
                    description: The device's status
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security: []
            summary: Get the device's status
            tags:
                - status
    /status/oobe:
        get:
            operationId: getStatusOOBE
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OOBE'
                    description: The OOBE status
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            security: []
            summary: Get the OOBE status
            tags:
                - status
    /time:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimeConfig'
                    description: The system's current time configuration
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            summary: Returns the system's current time configuration
            tags:
                - System
        post:
            description: Configures the system's time
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimeConfig'
                description: The time configuration to apply
                required: true
            responses:
                "202":
                    description: The request has been accepted
                "400":
                    description: Bad input parameter
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and returned an error
            tags:
                - System
    /update:
        get:
            parameters:
                - description: Type of update we want to allow
                  in: query
                  name: type
                  required: false
                  schema:
                    $ref: '#/components/schemas/UpdateType'
                - description: Force the check of the available versions
                  in: query
                  name: force
                  required: false
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Update'
                                type: array
                    description: Returns the list of available updates
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The request failed and return an error
            security:
                - BearerAuth:
                    - mayday
                    - admin
            summary: Return available updates
            tags:
                - Support
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Update'
                description: The version we want to apply
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateInfo'
